<!DOCTYPE html>
<html lang="nl" style="--acc: #1f6fe5;">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IrfanGames Hub</title>
  <style>
    :root {
      --bg: #04070f;
      --panel: rgba(255, 255, 255, 0.05);
      --border: rgba(255, 255, 255, 0.12);
      --acc: #1f6fe5;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background: var(--bg);
      color: #fff;
      min-height: 100vh;
      padding: 20px;
      overflow-x: hidden;
    }
    .glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(circle at 12% 10%, rgba(31, 111, 229, 0.25), transparent 42%),
        radial-gradient(circle at 88% 20%, rgba(56, 189, 248, 0.12), transparent 38%),
        radial-gradient(circle at 50% 95%, rgba(31, 111, 229, 0.16), transparent 45%);
    }
    .wrap { position: relative; z-index: 1; max-width: 1140px; margin: 0 auto; }

    .announcement {
      display: none;
      margin-bottom: 18px;
      padding: 12px 16px;
      border-radius: 14px;
      background: rgba(31, 111, 229, 0.2);
      border: 1px solid var(--acc);
      color: #e2e8f0;
      font-weight: 600;
    }
    .announcement.show { display: flex; justify-content: space-between; align-items: center; gap: 12px; }

    header.top {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    .brand {
      background: linear-gradient(135deg, var(--acc), #0ea5e9);
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 10px 18px;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(31, 111, 229, 0.35);
      user-select: none;
    }
    .btn {
      background: var(--panel);
      color: #fff;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 9px 16px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
    }
    .btn:hover { border-color: var(--acc); background: rgba(31, 111, 229, 0.18); }
    .btn.pri { background: var(--acc); border-color: var(--acc); }
    .btn.pri:hover { filter: brightness(1.12); }
    .btn.danger { background: rgba(239, 68, 68, 0.18); border-color: rgba(248, 113, 113, 0.45); color: #fca5a5; }

    .admin-only { display: none; }
    body.admin-unlocked .admin-only { display: inline-flex; }

    .srch {
      margin-left: auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
    }
    .srch input {
      background: transparent;
      border: none;
      color: #fff;
      outline: none;
      width: 190px;
    }

    /* Game van de dag Hero Card */
    .gotd-hero {
      position: relative;
      border-radius: 26px;
      padding: 28px 32px;
      margin-bottom: 26px;
      background:
        radial-gradient(circle at 18% 35%, rgba(20, 120, 155, 0.38), transparent 52%),
        radial-gradient(circle at 60% 25%, rgba(124, 58, 237, 0.24), transparent 50%),
        linear-gradient(125deg, #0d2633 0%, #16182c 52%, #0c1324 100%);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.45);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      overflow: hidden;
    }
    .gotd-left {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      z-index: 1;
    }

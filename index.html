<!DOCTYPE html>
<html lang="nl" style="--acc: #1f6fe5;">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IrfanGames Hub</title>
  <style>
    :root {
      --bg: #04070f;
      --panel: rgba(255, 255, 255, 0.05);
      --border: rgba(255, 255, 255, 0.12);
      --acc: #1f6fe5;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background: var(--bg);
      color: #fff;
      min-height: 100vh;
      padding: 20px;
      overflow-x: hidden;
    }
    .glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(circle at 12% 10%, rgba(31, 111, 229, 0.25), transparent 42%),
        radial-gradient(circle at 88% 20%, rgba(56, 189, 248, 0.12), transparent 38%),
        radial-gradient(circle at 50% 95%, rgba(31, 111, 229, 0.16), transparent 45%);
    }
    .wrap { position: relative; z-index: 1; max-width: 1140px; margin: 0 auto; }

    /* Top bar */
    header.top {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    .brand {
      background: linear-gradient(135deg, #1f6fe5, #0ea5e9);
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 10px 18px;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(31, 111, 229, 0.35);
    }
    .btn {
      background: var(--panel);
      color: #fff;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 9px 16px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
    }
    .btn:hover { border-color: var(--acc); background: rgba(31, 111, 229, 0.18); }
    .btn.pri {
      background: var(--acc);
      border-color: var(--acc);
    }
    .btn.pri:hover { filter: brightness(1.12); }

    /* Admin controls hidden until Alt + P unlocked */
    .admin-only { display: none; }
    body.admin-unlocked .admin-only { display: inline-flex; }

    .srch {
      margin-left: auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
    }
    .srch input {
      background: transparent;
      border: none;
      color: #fff;
      outline: none;
      width: 190px;
    }

    /* Hero */
    .hero {
      border-radius: 24px;
      padding: 30px;
      margin-bottom: 24px;
      background: linear-gradient(125deg, rgba(31, 111, 229, 0.24), rgba(11, 19, 38, 0.92) 55%, rgba(14, 165, 233, 0.14));
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(12px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    .hero small { color: #7dd3fc; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
    .hero h1 { font-size: clamp(1.6rem, 3vw, 2.3rem); margin: 6px 0 10px; }
    .hero p { color: #cbd5e1; max-width: 560px; margin-bottom: 18px; }

    /* Tabs */
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .tab {
      background: var(--panel);
      color: #cbd5e1;
      border: 1px solid var(--border);
      padding: 9px 18px;
      border-radius: 999px;
      font-weight: 600;
      cursor: pointer;
    }
    .tab.on { background: var(--acc); border-color: var(--acc); color: #fff; }

    /* Grid */
    h2 { font-size: 1.25rem; margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }
    h2 small { color: var(--muted); font-size: 0.85rem; font-weight: 500; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 40px;
    }
    .tile {
      position: relative;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
    }
    .tile:hover {
      transform: translateY(-4px);
      border-color: var(--acc);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45);
    }
    .thumb {
      height: 132px;
      background: linear-gradient(135deg, #0f1f3d, #182e59);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.3rem;
      background-size: cover;
      background-position: center;
    }
    .badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: var(--acc);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
    }
    .del {
      display: none;
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(15, 23, 42, 0.85);
      color: #f87171;
      border: 1px solid rgba(248, 113, 113, 0.35);
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 0.75rem;
      cursor: pointer;
    }
    body.admin-unlocked .del { display: inline-block; }

    .strip {
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
    }

    /* Modals */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(2, 6, 17, 0.85);
      backdrop-filter: blur(6px);
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .overlay.open { display: flex; }
    .dialog {
      width: 100%;
      max-width: 560px;
      background: #0b1222;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 22px;
    }
    .dialog h3 { margin-bottom: 14px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 0.85rem; color: #cbd5e1; margin-bottom: 6px; }
    .field input, .field select, .field textarea {
      width: 100%;
      background: #050914;
      border: 1px solid var(--border);
      color: #fff;
      border-radius: 12px;
      padding: 10px 12px;
      outline: none;
    }
    .field textarea { min-height: 150px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.85rem; }
    .mode-switch { display: flex; gap: 8px; margin-bottom: 14px; }
    .mode-btn {
      flex: 1;
      padding: 9px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #050914;
      color: #cbd5e1;
      font-weight: 600;
      cursor: pointer;
    }
    .mode-btn.active { background: var(--acc); border-color: var(--acc); color: #fff; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
    .err-msg { color: #f87171; font-size: 0.85rem; margin-top: 6px; display: none; }

    /* Player */
    .player {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 70;
      background: var(--bg);
      flex-direction: column;
    }
    .player.open { display: flex; }
    .player-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      background: #0a1020;
      border-bottom: 1px solid var(--border);
    }
    .player iframe { flex: 1; width: 100%; border: none; background: #fff; }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="wrap">
    <header class="top">
      <button class="brand" onclick="resetView()">⚡ IrfanGames</button>
      <button class="btn pri admin-only" onclick="openAddModal()">+ Voeg toe (Link / HTML)</button>
      <button class="btn admin-only" onclick="resetCustomItems()">Reset opgeslagen</button>
      <button class="btn admin-only" onclick="lockAdmin()">🔒 Vergrendel</button>
      <label class="srch">
        <input type="search" id="search" placeholder="Zoek game of app..." oninput="render()">
      </label>
    </header>

    <section class="hero">
      <div>
        <small>IrfanGames Hub</small>
        <h1 id="heroTitle">Youtube ad skipper</h1>
        <p id="heroDesc">Speel games en gebruik handige web-apps direct in je browser.</p>
        <button class="btn pri" id="heroPlayBtn">▶ Openen</button>
      </div>
    </section>

    <div class="tabs">
      <button class="tab on" id="t-all" onclick="setTab('all')">Alles</button>
      <button class="tab" id="t-games" onclick="setTab('games')">Games</button>
      <button class="tab" id="t-apps" onclick="setTab('apps')">Apps</button>
    </div>

    <h2 id="heading">Alles <small id="count"></small></h2>
    <div class="grid" id="grid"></div>
  </div>

  <!-- Admin Unlock Modal (Alt + P) -->
  <div class="overlay" id="authModal">
    <div class="dialog" style="max-width: 380px;">
      <h3>Admin Toegang</h3>
      <form onsubmit="checkAdminCode(event)">
        <div class="field">
          <label for="adminCodeInput">Voer de geheime code in</label>
          <input type="password" id="adminCodeInput" placeholder="Code..." autocomplete="off">
          <div class="err-msg" id="authErr">Verkeerde code. Probeer opnieuw.</div>
        </div>
        <div class="dialog-actions">
          <button type="button" class="btn" onclick="closeAuthModal()">Annuleren</button>
          <button type="submit" class="btn pri">Ontgrendelen</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Add Item Modal -->
  <div class="overlay" id="addModal">
    <div class="dialog">
      <h3>Game of App toevoegen</h3>

      <div class="mode-switch">
        <button type="button" class="mode-btn active" id="modeLinkBtn" onclick="setMode('link')">Via Link (URL)</button>
        <button type="button" class="mode-btn" id="modeHtmlBtn" onclick="setMode('html')">Via HTML-code</button>
      </div>

      <div class="field">
        <label for="itemTitle">Naam</label>
        <input type="text" id="itemTitle" placeholder="Bijv. Youtube ad skipper">
      </div>

      <div class="field">
        <label for="itemCat">Categorie</label>
        <select id="itemCat">
          <option value="games">Games</option>
          <option value="apps">Apps</option>
        </select>
      </div>

      <div class="field">
        <label for="itemIcon">Emoji of Cover-afbeelding URL</label>
        <input type="text" id="itemIcon" placeholder="🎮 of https://...">
      </div>

      <div class="field" id="linkField">
        <label for="itemUrl">Game / App Link (URL)</label>
        <input type="url" id="itemUrl" placeholder="https://voorbeeld.nl/game">
      </div>

      <div class="field" id="htmlField" style="display:none;">
        <label for="itemHtml">Plak hier je HTML-code</label>
        <textarea id="itemHtml" placeholder="<!DOCTYPE html><html><body><h1>Mijn Game</h1></body></html>"></textarea>
      </div>

      <div class="dialog-actions">
        <button type="button" class="btn" onclick="closeAddModal()">Annuleren</button>
        <button type="button" class="btn pri" onclick="saveItem()">Opslaan</button>
      </div>
    </div>
  </div>

  <!-- Player Modal -->
  <div class="player" id="player">
    <div class="player-bar">
      <strong id="playerTitle">Titel</strong>
      <button class="btn pri" onclick="closePlayer()">✕ Sluiten</button>
    </div>
    <iframe id="frame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
  </div>

  <script>
    const ADMIN_CODE = "irfan";
    const STORAGE_KEY = "custom_hub_items_v1";
    let isAdmin = false;

    const DEFAULT_ITEMS = [
      {
        id: "def-1",
        title: "Youtube ad skipper",
        category: "apps",
        icon: "⏭️",
        type: "html",
        html: `<!DOCTYPE html><html><body style="font-family:sans-serif;background:#0b1120;color:#fff;padding:24px;"><h2>YouTube Ad Skipper App</h2><p>Jouw HTML-code draait hier direct in de hub.</p></body></html>`
      }
    ];

    let customItems = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    let currentTab = "all";
    let addMode = "link";

    // Shortcut Alt + P
    document.addEventListener("keydown", (e) => {
      if (e.altKey && e.key.toLowerCase() === "p") {
        e.preventDefault();
        if (isAdmin) {
          lockAdmin();
        } else {
          openAuthModal();
        }
      }
    });

    function openAuthModal() {
      document.getElementById("authErr").style.display = "none";
      const input = document.getElementById("adminCodeInput");
      input.value = "";
      document.getElementById("authModal").classList.add("open");
      setTimeout(() => input.focus(), 50);
    }

    function closeAuthModal() {
      document.getElementById("authModal").classList.remove("open");
    }

    function checkAdminCode(e) {
      e.preventDefault();
      const val = document.getElementById("adminCodeInput").value.trim();
      if (val === ADMIN_CODE) {
        isAdmin = true;
        document.body.classList.add("admin-unlocked");
        closeAuthModal();
      } else {
        document.getElementById("authErr").style.display = "block";
      }
    }

    function lockAdmin() {
      isAdmin = false;
      document.body.classList.remove("admin-unlocked");
      closeAddModal();
    }

    function getAllItems() {
      return [...customItems, ...DEFAULT_ITEMS];
    }

    function setTab(tab) {
      currentTab = tab;
      document.querySelectorAll(".tab").forEach(b => b.classList.remove("on"));
      document.getElementById("t-" + tab).classList.add("on");
      render();
    }

    function resetView() {
      document.getElementById("search").value = "";
      setTab("all");
    }

    function openAddModal() {
      if (!isAdmin) return openAuthModal();
      document.getElementById("addModal").classList.add("open");
    }

    function closeAddModal() {
      document.getElementById("addModal").classList.remove("open");
    }

    function setMode(mode) {
      addMode = mode;
      document.getElementById("modeLinkBtn").classList.toggle("active", mode === "link");
      document.getElementById("modeHtmlBtn").classList.toggle("active", mode === "html");
      document.getElementById("linkField").style.display = mode === "link" ? "block" : "none";
      document.getElementById("htmlField").style.display = mode === "html" ? "block" : "none";
    }

    function saveItem() {
      if (!isAdmin) return;
      const title = document.getElementById("itemTitle").value.trim();
      const category = document.getElementById("itemCat").value;
      const icon = document.getElementById("itemIcon").value.trim() || (category === "games" ? "🎮" : "⚡");
      const url = document.getElementById("itemUrl").value.trim();
      const html = document.getElementById("itemHtml").value;

      if (!title) return alert("Vul eerst een naam in.");
      if (addMode === "link" && !url) return alert("Vul een geldige link in.");
      if (addMode === "html" && !html.trim()) return alert("Plak eerst je HTML-code.");

      customItems.unshift({
        id: "c-" + Date.now(),
        title,
        category,
        icon,
        type: addMode,
        url,
        html
      });

      localStorage.setItem(STORAGE_KEY, JSON.stringify(customItems));
      document.getElementById("itemTitle").value = "";
      document.getElementById("itemUrl").value = "";
      document.getElementById("itemHtml").value = "";
      closeAddModal();
      render();
    }

    function deleteCustom(e, id) {
      e.stopPropagation();
      if (!isAdmin) return;
      customItems = customItems.filter(item => item.id !== id);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(customItems));
      render();
    }

    function resetCustomItems() {
      if (!isAdmin) return;
      customItems = [];
      localStorage.removeItem(STORAGE_KEY);
      render();
    }

    function launchItem(item) {
      document.getElementById("playerTitle").textContent = item.title;
      const frame = document.getElementById("frame");

      if (item.type === "html") {
        frame.removeAttribute("src");
        frame.srcdoc = item.html;
      } else {
        frame.removeAttribute("srcdoc");
        frame.src = item.url;
      }

      document.getElementById("player").classList.add("open");
    }

    function closePlayer() {
      document.getElementById("player").classList.remove("open");
      document.getElementById("frame").removeAttribute("src");
      document.getElementById("frame").removeAttribute("srcdoc");
    }

    function render() {
      const q = document.getElementById("search").value.toLowerCase();
      const all = getAllItems();
      const filtered = all.filter(item => {
        const matchTab = currentTab === "all" || item.category === currentTab;
        const matchSearch = item.title.toLowerCase().includes(q);
        return matchTab && matchSearch;
      });

      const labels = { all: "Alles", games: "Games", apps: "Apps" };
      document.getElementById("heading").innerHTML =
        `${labels[currentTab]} <small>${filtered.length} items</small>`;

      if (all[0]) {
        document.getElementById("heroTitle").textContent = all[0].title;
        document.getElementById("heroPlayBtn").onclick = () => launchItem(all[0]);
      }

      const grid = document.getElementById("grid");
      grid.innerHTML = "";

      filtered.forEach(item => {
        const isImage = item.icon.startsWith("http");
        const tile = document.createElement("div");
        tile.className = "tile";
        tile.onclick = () => launchItem(item);
        tile.innerHTML = `
          <span class="badge">${item.type === "html" ? "HTML" : "LINK"}</span>
          ${item.id.startsWith("c-") ? `<button class="del" title="Verwijder">✕</button>` : ""}
          <div class="thumb" style="${isImage ? `background-image:url('${item.icon}')` : ""}">
            ${isImage ? "" : item.icon}
          </div>
          <div class="strip">
            <span>${item.title}</span>
            <span>▶</span>
          </div>
        `;
        const delBtn = tile.querySelector(".del");
        if (delBtn) delBtn.onclick = (e) => deleteCustom(e, item.id);
        grid.appendChild(tile);
      });
    }

    render();
  </script>
</body>
</html>

<button type="button" id="downloadBtn">Download Data</button>

<script>
  function downloadFile(filename, textContent) {
    const blob = new Blob([textContent], { type: "application/json;charset=utf-8" });
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();

    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  document.getElementById("downloadBtn")?.addEventListener("click", () => {
    const sampleData = JSON.stringify({ exportedAt: new Date().toISOString() }, null, 2);
    downloadFile("export.json", sampleData);
  });
</script>
